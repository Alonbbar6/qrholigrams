import { DRACOLoader } from '/js/vendor/three/loaders/DRACOLoader.js';
import { USDZExporter } from '/js/vendor/three/exporters/USDZExporter.js';

const src = new URLSearchParams(location.search).get('src');

  // a narrower PBR set than glTF.
  const mats = [];
  scene.traverse((o) => {
    if (!o.isMesh) return;

      if (!m) continue;

        name: m.name || '(unnamed)',
        type: m.type,
        maps: ['map','normalMap','roughnessMap','metalnessMap','emissiveMap','aoMap']
              .filter((k) => m[k]),
        metalness: m.metalness, roughness: m.roughness,

    bytes: bytes.length,
    materials: report(scene),
